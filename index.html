<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Life Planner</title>
  <meta name="description" content="วางแผนชีวิต งาน เป้าหมาย และตารางเวลา ในที่เดียว" />
  <meta name="theme-color" content="#f4f2fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#110f26" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/favicon-64.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Planner" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/views.css" />
  <script>
    // ตั้งธีมก่อนโหลดหน้า ป้องกันการกระพริบ
    try {
      const s = JSON.parse(localStorage.getItem('planner.v1') || '{}').settings;
      if (s && (s.theme === 'light' || s.theme === 'dark')) document.documentElement.dataset.theme = s.theme;
    } catch (e) {}
  </script>
  <style>
    /* ---------- หน้าโหลด (inline เพื่อให้แสดงทันที) ---------- */
    .splash {
      --sp-gold: #e3b23c;
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #f3f0ff;
      background:
        radial-gradient(60% 50% at 50% 42%, rgba(130, 112, 220, 0.55) 0%, transparent 70%),
        radial-gradient(40% 35% at 85% 10%, rgba(242, 167, 195, 0.18) 0%, transparent 70%),
        linear-gradient(160deg, #1b1840 0%, #2a2563 50%, #3b3290 100%);
      font-family: 'Prompt', 'Noto Sans Thai', system-ui, sans-serif;
      padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
    }
    .sp-center { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
    .sp-logo { position: relative; width: 132px; height: 132px; display: grid; place-items: center; margin-bottom: 18px; }
    .sp-logo img {
      position: relative;
      z-index: 2;
      width: 112px;
      height: 112px;
      border-radius: 28px;
      box-shadow: 0 20px 50px -14px rgba(10, 8, 30, 0.8), 0 0 0 3px rgba(227, 178, 60, 0.55);
      animation: spPop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both, spFloat 3.2s ease-in-out 1s infinite;
    }
    .sp-glow {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(185, 169, 255, 0.55) 0%, transparent 65%);
      animation: spGlow 2.4s ease-in-out infinite;
    }
    .sp-orbit {
      position: absolute;
      inset: -22px;
      border-radius: 50%;
      border: 1.5px dashed rgba(227, 178, 60, 0.45);
      animation: spSpin 9s linear infinite, spFade 0.6s ease 0.5s both;
    }
    .sp-orbit i {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--sp-gold);
      box-shadow: 0 0 12px var(--sp-gold);
    }
    .sp-orbit i:nth-child(1) { top: -5px; left: calc(50% - 5px); }
    .sp-orbit i:nth-child(2) { bottom: 14%; left: 2%; width: 7px; height: 7px; background: #f2a7c3; box-shadow: 0 0 10px #f2a7c3; }
    .sp-orbit i:nth-child(3) { bottom: 14%; right: 2%; width: 7px; height: 7px; background: #b9a9ff; box-shadow: 0 0 10px #b9a9ff; }
    .sp-title { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: 0.01em; }
    .sp-title span { display: inline-block; animation: spLetter 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; animation-delay: calc(0.45s + var(--i) * 45ms); }
    .sp-words { display: flex; gap: 10px; margin: 2px 0 26px; font-size: 14px; color: rgba(243, 240, 255, 0.78); font-family: 'Noto Sans Thai', system-ui, sans-serif; }
    .sp-words span { animation: spUp 0.5s ease both; }
    .sp-words span:nth-child(1) { animation-delay: 1s; }
    .sp-words span:nth-child(2) { animation-delay: 1.1s; color: var(--sp-gold); }
    .sp-words span:nth-child(3) { animation-delay: 1.2s; }
    .sp-words span:nth-child(4) { animation-delay: 1.3s; color: var(--sp-gold); }
    .sp-words span:nth-child(5) { animation-delay: 1.4s; }
    .sp-bar { width: 180px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.14); overflow: hidden; animation: spFade 0.4s ease 0.6s both; }
    .sp-bar span {
      display: block;
      height: 100%;
      width: 8%;
      border-radius: inherit;
      background: linear-gradient(90deg, #b9a9ff, var(--sp-gold), #fff3cf, var(--sp-gold));
      background-size: 200% 100%;
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      animation: spShimmer 1.4s linear infinite;
    }
    .sp-status { margin: 10px 0 0; font-size: 12.5px; color: rgba(243, 240, 255, 0.62); font-family: 'Noto Sans Thai', system-ui, sans-serif; min-height: 1.4em; animation: spFade 0.4s ease 0.7s both; }
    .sp-petals i {
      position: absolute;
      top: -20px;
      left: var(--x);
      width: 11px;
      height: 9px;
      border-radius: 11px 1px 11px 1px;
      background: #f2a7c3;
      opacity: 0;
      animation: spPetal var(--d) linear infinite;
      animation-delay: var(--dl);
    }
    .splash.sp-out { animation: spOut 0.7s cubic-bezier(0.65, 0, 0.35, 1) forwards; pointer-events: none; }
    .splash.sp-out .sp-logo img { animation: spZoom 0.7s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
    .splash.sp-out .sp-center > :not(.sp-logo) { transition: opacity 0.25s, transform 0.3s; opacity: 0; transform: translateY(8px); }
    html.sp-lock, html.sp-lock body { overflow: hidden; }
    .splash.sp-quick .sp-title span, .splash.sp-quick .sp-words span { animation-delay: 0s; animation-duration: 0.3s; }
    @keyframes spPop { 0% { opacity: 0; transform: scale(0.4) rotate(-12deg); } 70% { opacity: 1; transform: scale(1.06) rotate(2deg); } 100% { transform: scale(1) rotate(0); } }
    @keyframes spFloat { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
    @keyframes spGlow { 0%, 100% { opacity: 0.55; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes spSpin { to { rotate: 360deg; } }
    @keyframes spFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes spLetter { from { opacity: 0; transform: translateY(14px) scale(0.9); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
    @keyframes spUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes spShimmer { from { background-position: 0% 0; } to { background-position: -200% 0; } }
    @keyframes spPetal { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 10% { opacity: 0.8; } 100% { transform: translate(-70px, 105vh) rotate(380deg); opacity: 0; } }
    @keyframes spOut { 0% { opacity: 1; clip-path: circle(150% at 50% 42%); } 100% { opacity: 0; clip-path: circle(0% at 50% 42%); } }
    @keyframes spZoom { to { transform: scale(1.25); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .splash *, .splash { animation-duration: 0.01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; }
      .sp-petals { display: none; }
    }
  </style>
</head>
<body>
  <div id="splash" class="splash" role="status" aria-live="polite" aria-label="กำลังโหลด Life Planner">
    <div class="sp-petals" aria-hidden="true">
      <i style="--x:12%;--d:7s;--dl:-1s"></i><i style="--x:30%;--d:9s;--dl:-4s"></i><i style="--x:52%;--d:8s;--dl:-2.5s"></i>
      <i style="--x:70%;--d:10s;--dl:-6s"></i><i style="--x:86%;--d:7.5s;--dl:-3s"></i><i style="--x:95%;--d:11s;--dl:-8s"></i>
    </div>
    <div class="sp-center">
      <div class="sp-logo" aria-hidden="true">
        <span class="sp-glow"></span>
        <span class="sp-orbit"><i></i><i></i><i></i></span>
        <img src="icons/icon-512.png" alt="" width="112" height="112" />
      </div>
      <p class="sp-title"><span style="--i:0">L</span><span style="--i:1">i</span><span style="--i:2">f</span><span style="--i:3">e</span><span style="--i:4">&nbsp;</span><span style="--i:5">P</span><span style="--i:6">l</span><span style="--i:7">a</span><span style="--i:8">n</span><span style="--i:9">n</span><span style="--i:10">e</span><span style="--i:11">r</span></p>
      <p class="sp-words"><span>วางแผน</span><span>·</span><span>โฟกัส</span><span>·</span><span>สำเร็จ</span></p>
      <div class="sp-bar"><span id="sp-bar"></span></div>
      <p class="sp-status" id="sp-status">กำลังเตรียมแผนของคุณ…</p>
    </div>
  </div>
  <script>
    document.documentElement.classList.add('sp-lock');
    // กันค้าง: ถ้าแอปโหลดไม่สำเร็จ ให้ปิดหน้าโหลดเองหลัง 8 วินาที
    setTimeout(function () {
      var s = document.getElementById('splash');
      if (s) { s.remove(); document.documentElement.classList.remove('sp-lock'); }
    }, 8000);
  </script>
  <div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="petals" aria-hidden="true">
    <i style="--x:8%;--d:19s;--delay:-2s"></i><i style="--x:27%;--d:23s;--delay:-11s"></i>
    <i style="--x:46%;--d:17s;--delay:-6s"></i><i style="--x:63%;--d:25s;--delay:-15s"></i>
    <i style="--x:78%;--d:21s;--delay:-4s"></i><i style="--x:90%;--d:18s;--delay:-9s"></i>
    <i style="--x:55%;--d:27s;--delay:-20s"></i>
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo"><img id="brand-img" src="icons/icon-192.png" alt="" width="46" height="46" /></div>
        <div>
          <div class="brand-name">Life Planner</div>
          <div class="brand-sub">วางแผนชีวิตให้ชัดเจน</div>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="เมนูหลัก"></nav>
      <div class="sidebar-foot">
        <button class="btn btn-ghost btn-block" id="btn-settings" type="button"></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">ภาพรวม</h1>
          <p id="page-sub" class="muted"></p>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn gc-btn" id="btn-sync" type="button" aria-label="ซิงก์ Google Calendar" hidden></button>
          <button class="icon-btn" id="btn-theme" type="button" aria-label="สลับธีม"></button>
          <button class="icon-btn only-mobile" id="btn-settings-m" type="button" aria-label="ตั้งค่า"></button>
          <div class="quick-add">
            <button class="btn btn-primary" id="btn-quick" type="button" aria-haspopup="menu" aria-expanded="false"></button>
            <div class="menu" id="quick-menu" role="menu" hidden></div>
          </div>
        </div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="เมนูหลัก (มือถือ)"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script type="module" src="js/app.js"></script>
</body>
</html>
